<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Orbitron;font-weight:700;src:url("../www/fonts/orbitron-latin-700-normal.woff2") format("woff2")}
html,body{margin:0;background:transparent;overflow:hidden}
#c{position:relative;overflow:hidden}
.bg{position:absolute;inset:0;background:radial-gradient(70% 60% at 78% 12%,#3a237f 0,transparent 70%),radial-gradient(60% 55% at 8% 80%,#0d3a66 0,transparent 70%),#070a1f}
.st{position:absolute;border-radius:50%;background:#dff6ff}
.mark{position:absolute;filter:drop-shadow(0 0 calc(var(--u)*.06) #ffe7a0aa)}
.mono .mark{filter:brightness(0) invert(1)}
.word{position:absolute;left:0;right:0;text-align:center;font:700 calc(var(--u)*.095)/1 Orbitron,sans-serif;color:#fff;letter-spacing:.04em;text-shadow:0 0 calc(var(--u)*.08) #ffe7a088}
</style></head><body><svg width="0" height="0" style="position:absolute"><defs><symbol id="moonmark" viewBox="0 0 48 48">
<defs><radialGradient id="mg" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#fffbe6"/><stop offset=".55" stop-color="#ffe7a0"/><stop offset="1" stop-color="#e0b84e"/></radialGradient>
<mask id="mc"><rect width="48" height="48" fill="#fff"/><circle cx="33" cy="17" r="16" fill="#000"/></mask></defs>
<circle cx="22" cy="25" r="20" fill="url(#mg)" mask="url(#mc)"/>
<circle cx="12" cy="30" r="2.2" fill="#e0b84e" opacity=".6"/><circle cx="17" cy="38" r="1.6" fill="#e0b84e" opacity=".6"/>
<circle cx="33" cy="23" r="4" fill="#3ef2ff"/><path d="M29.5 27.5h7l1.6 9h-10.2z" fill="#3ef2ff"/><rect x="26.5" y="36" width="13" height="3.4" rx="1.7" fill="#3ef2ff"/>
</symbol><symbol id="mcres" viewBox="0 0 48 48">
<defs><radialGradient id="mg2" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#fffbe6"/><stop offset=".55" stop-color="#ffe7a0"/><stop offset="1" stop-color="#e0b84e"/></radialGradient>
<mask id="mc2"><rect width="48" height="48" fill="#fff"/><circle cx="33" cy="17" r="16" fill="#000"/></mask></defs>
<circle cx="22" cy="25" r="20" fill="url(#mg2)" mask="url(#mc2)"/>
<circle cx="12" cy="30" r="2.2" fill="#e0b84e" opacity=".6"/><circle cx="17" cy="38" r="1.6" fill="#e0b84e" opacity=".6"/>
</symbol><symbol id="mpawn" viewBox="0 0 48 48"><circle cx="33" cy="23" r="4" fill="#3ef2ff"/><path d="M29.5 27.5h7l1.6 9h-10.2z" fill="#3ef2ff"/><rect x="26.5" y="36" width="13" height="3.4" rx="1.7" fill="#3ef2ff"/></symbol></defs></svg><div id="c"></div>
<script>
function draw(mode,W,H){
  const c=document.getElementById('c');c.className=mode==='mono'?'mono':'';c.style.width=W+'px';c.style.height=H+'px';
  const u=Math.min(W,H);c.style.setProperty('--u',u+'px');let h='';
  if(mode==='bg'||mode==='splash'){h+='<div class="bg"></div>';let s=11;const r=()=>(s=(s*16807)%2147483647)/2147483647;
    const n=mode==='bg'?26:Math.round(W*H/9000);for(let i=0;i<n;i++){const z=.4+r()*1.2;h+=`<i class="st" style="left:${r()*W}px;top:${r()*H}px;width:${z*u/260}px;height:${z*u/260}px;opacity:${.35+r()*.6}"></i>`}}
  if(mode==='mc'||mode==='mp'){c.className='mono';const m=u*.56;h+=`<svg class="mark" viewBox="0 0 48 48" style="left:${(W-m)/2+u*.01}px;top:${(H-m)/2}px;width:${m}px;height:${m}px"><use href="#${mode==='mc'?'mcres':'mpawn'}"/></svg>`}
  if(mode==='fg'||mode==='mono'){const m=u*.56;h+=`<svg class="mark" viewBox="0 0 48 48" style="left:${(W-m)/2+u*.01}px;top:${(H-m)/2}px;width:${m}px;height:${m}px"><use href="#moonmark"/></svg>`}
  if(mode==='splash'){const m=u*.34;h+=`<svg class="mark" viewBox="0 0 48 48" style="left:${(W-m)/2}px;top:${H/2-m*.78}px;width:${m}px;height:${m}px"><use href="#moonmark"/></svg>`;
    h+=`<div class="word" style="top:${H/2+u*.07}px">MoonChess</div>`}
  c.innerHTML=h;
}
</script></body></html>
